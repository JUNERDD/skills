interface:
  display_name: "GitHub + Context7 Research"
  short_description: "Verify library docs against source and history"
  default_prompt: "Use $github-context7-research to verify this library question against version-matched documentation, source, tests, and repository history."

dependencies:
  tools:
    - type: "mcp"
      value: "github"
      description: "GitHub MCP for read-only source, test, release, issue, pull request, and commit evidence"
      transport: "streamable_http"
      url: "https://api.githubcopilot.com/mcp/readonly"
    - type: "mcp"
      value: "context7"
      description: "Context7 MCP for current and version-specific public library documentation"
      transport: "streamable_http"
      url: "https://mcp.context7.com/mcp"

policy:
  allow_implicit_invocation: true
